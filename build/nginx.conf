# Serves the built SPA and proxies the API. Runs unprivileged on 8080.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # "vulnviz-api" is the Kubernetes Service (a network alias in Compose). The
    # ClusterIP is stable, so resolving it once at start-up is fine; the pod is
    # simply restarted by its probes if the service does not exist yet.
    location /api/ {
      proxy_pass http://vulnviz-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 90s;
    }
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
  }
}
