apiVersion: v1
kind: Service
metadata:
  name: vulnviz-api
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnviz-api
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: vulnviz-api
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vulnviz-db, key: DATABASE_URL } }
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
