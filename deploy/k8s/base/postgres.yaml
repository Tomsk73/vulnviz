apiVersion: v1
kind: Service
metadata:
  name: vulnviz-db
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: db }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: db }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vulnviz-db
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: db }
spec:
  serviceName: vulnviz-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: db }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: cgr.dev/chainguard/postgres:latest
          args:
            - -c
            - shared_buffers=1GB
            - -c
            - work_mem=128MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_wal_size=4GB
            - -c
            - random_page_cost=1.1
          envFrom:
            - secretRef: { name: vulnviz-db }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, vulnviz] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, vulnviz] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 40Gi } }
