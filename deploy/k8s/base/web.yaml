apiVersion: v1
kind: Service
metadata:
  name: vulnviz-web
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnviz-web
  labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vulnviz, app.kubernetes.io/component: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: vulnviz-web
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /var/lib/nginx/tmp }
            - { name: run, mountPath: /var/run }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnviz
  labels: { app.kubernetes.io/name: vulnviz }
spec:
  rules:
    - host: vulnviz.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: vulnviz-web, port: { name: http } } }
